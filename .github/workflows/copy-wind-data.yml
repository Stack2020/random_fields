
name: Copy Wind Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Download data from original Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download wind-data \
            --repo xujianscut/krflow \
            --pattern "wind_hdf5.tar.gz"

      - name: Verify downloaded file
        run: |
          test "$(stat -c%s wind_hdf5.tar.gz)" -eq 1116569981

      - name: Upload data to my Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload wind_data \
            ./wind_hdf5.tar.gz \
            --repo "$GITHUB_REPOSITORY"
